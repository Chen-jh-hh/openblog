baseURL: https://chen-jh-hh.github.io/openblog/
languageCode: zh-cn
defaultContentLanguage: zh
title: 无名的博客
theme: PaperMod

enableEmoji: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false

params:
  author: 无名
  description: "个人博客 - 记录技术与生活"
  keywords: [Blog, 技术, 编程, 生活]
  defaultTheme: auto
  ShowReadingTime: true
  ShowWordCount: true
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  socialIcons:
    - name: github
      url: "https://github.com/Chen-jh-hh"
    - name: rss
      url: "/index.xml"

  homeInfoParams:
    Title: "你好 👋"
    Content: >
      欢迎来到我的博客。
      这里记录我的技术探索和生活感悟。

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  label:
    text: "无名"
    icon: "🪶"
    iconHeight: 35

menu:
  main:
    - identifier: search
      name: 搜索
      url: /search/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
